name: Frontend offline validation
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study-viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Install viewer dependencies only
        run: |
          python -m pip install setuptools==82.0.1
          python -m pip install -r requirements.lock.txt
          python -m pip install --no-deps --no-build-isolation .
          npm install --global pnpm@11.19.0
          pnpm --dir web install --frozen-lockfile
      - name: Read-only adapter, path safety, parser and synthetic integration checks
        run: python -B -m unittest discover -s tests -t . -v
      - name: Typecheck and production build
        run: pnpm --dir web build
      - name: Install Chrome
        run: pnpm --dir web exec playwright install --with-deps chrome
      - name: Browser checks against temporary synthetic butane study
        run: |
          export AUTOG_SOURCE_PYTHON="$(command -v python)"
          pnpm --dir web test
