[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autog-frontend-readonly"
version = "4.6.2"
description = "Local read-only viewer for ag study directories"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi==0.141.1", "uvicorn==0.53.0"]

[project.scripts]
autog-readonly = "autog_frontend.__main__:main"

[project.optional-dependencies]
test = ["httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["autog_frontend*"]

[tool.setuptools.package-data]
autog_frontend = ["ui/index.html", "ui/assets/*"]
